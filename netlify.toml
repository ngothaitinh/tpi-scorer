[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "nft"

[build.environment]
  NODE_VERSION = "18"

# Redirect /.netlify/functions/* handled automatically by Netlify
# No extra redirects needed for single-page HTML app

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
